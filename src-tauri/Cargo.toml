[package]
name = "doopoo-desktop"
version = "0.1.0"
description = "Doopoo desktop shell"
authors = ["Doopoo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "doopoo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
